# Render.com blueprint for free/testing backend deploy.
# Free web services sleep after inactivity, so do not use this for production WhatsApp webhooks.
services:
  - type: web
    name: aura-salon-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_MAX_POOL_SIZE
        value: "10"
      - key: MONGODB_AUTO_INDEX
        value: "false"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: VERIFY_TOKEN
        sync: false
      - key: SEED_OWNER_PASSWORD
        sync: false
      - key: SEED_STAFF_PASSWORD
        sync: false
      - key: WHATSAPP_PROVIDER
        value: mock
